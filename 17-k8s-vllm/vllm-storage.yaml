apiVersion: v1
kind: PersistentVolume
metadata:
  name: vllm-model-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /srv/ai-infra/vllm-model-cache
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-pvc
  namespace: ai-infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: vllm-model-pv
  resources:
    requests:
      storage: 20Gi
